user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 80;
    server_name _;

    # ✅ penting agar upload GeoTIFF besar tidak 413
    client_max_body_size 1g;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Healthcheck opsional
    location = /healthz {
      proxy_pass http://web:8000/healthz;
      access_log off;
    }

    # Static files hasil collectstatic
    location /static/ {
      alias /app/staticfiles/;
      access_log off;
      expires 7d;
    }

    # Media uploads (GeoTIFF, tiles, dll)
    location /media/ {
      alias /app/media/;
      add_header Access-Control-Allow-Origin * always;
      add_header Accept-Ranges bytes;
      expires 0;
    }

    # Proxy semua request lain ke Django (Gunicorn di service "web")
    location / {
      proxy_pass         http://web:8000;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_redirect     off;

      # (opsional) bantu koneksi upload lambat
      # proxy_request_buffering off;
    }
  }
}
