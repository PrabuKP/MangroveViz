services:
  db:
    image: postgis/postgis:16-3.4
    container_name: mangrove_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # (opsional) publish port kalau mau akses dari host/pgAdmin lokal
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  web:
    build: ./web                     # <-- Dockerfile ada di ./web/Dockerfile
    container_name: mangrove_web
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    command: >
      sh -lc "python manage.py migrate --noinput &&
              python manage.py collectstatic --noinput &&
              gunicorn mangroveviz.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - ./web:/app
      - static_data:/app/staticfiles       # tempat collectstatic
      - media_data:/app/media              # tempat upload GeoTIFF
    expose:
      - "8000"                             # diakses internal oleh Nginx (tanpa publish ke host)

  nginx:
    image: nginx:1.27-alpine
    container_name: mangrove_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "3031:80"                          # akses publik via port 3031
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/app/staticfiles:ro    # Nginx melayani /static
      - media_data:/app/media:ro           # Nginx melayani /media

  # OPSIONAL
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: mangrove_pgadmin
    restart: unless-stopped
    env_file: .env
    environment:
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  db_data:
  static_data:
  media_data:
  pgadmin_data:
